[project]
name = "honeypatch"
version = "0.1.2"
license = "Apache-2.0"
requires-python = ">=3.10,<3.11"
description = "Honeypatch injects honeywires into arbitrary payload"
authors = [
    {name = "Mario Kahlhofer", email = "mario.kahlhofer@dynatrace.com>"}
]
dependencies = [
    "loguru (>=0.7.2,<0.8.0)",
    "pydantic (>=2.8.2,<3.0.0)",
    "PyYAML (>=6.0.1,<7.0.0)",
    "typer (>=0.12.3,<0.13.0)",
]

[project.urls]
repository = "https://github.com/dynatrace-oss/honeyquest"

[project.scripts]
honeypatch = "honeypatch.__main__:app"

[tool.poetry.group.dev.dependencies]
black = "*"
flake8 = "*"
flake8-docstrings = "*"
flake8-rst-docstrings = "*"
pylint = "*"
isort = "*"
mypy = "*"
pytest = "*"
pytest-cov = "*"
pre-commit = "*"
# typing stubs for mypy (must match types of dependencies)
types-PyYAML = "^6.0"

[tool.black]
line-length = 100

[tool.isort]
profile = "black"

[tool.pylint.main]
load-plugins = "pylint.extensions.docparams"
disable = [
    "fixme",
    "duplicate-code",
    "use-dict-literal",
    "broad-exception-caught",
    "logging-fstring-interpolation",
    "protected-access",
    "consider-using-with",
    "too-many-arguments",
    "too-many-positional-arguments",
    "too-many-statements",
    "too-many-locals",
    "too-few-public-methods",
    "missing-function-docstring",
    "missing-module-docstring",
    "wrong-import-order" # covered by isort
]

[tool.pylint.parameter_documentation]
default-docstring-type = "sphinx"

[tool.mypy]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = "tests"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
